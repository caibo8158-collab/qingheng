<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a4d45" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="轻衡" />
    <meta
      name="description"
      content="轻衡 — 简洁的体重记录，数据保存在你自己的设备上。"
    />
    <title>轻衡 · 体重记录</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="blob blob-a"></div>
      <div class="blob blob-b"></div>
      <div class="grain"></div>
    </div>

    <main class="app">
      <header class="hero">
        <p class="brand">轻衡</p>
        <h1 class="headline">把体重记下来，看见变化</h1>
        <p class="sub">数据只存在你自己的浏览器里，换设备请先导出备份。</p>
      </header>

      <section class="panel record" aria-labelledby="record-title">
        <div class="panel-head">
          <h2 id="record-title">今日体重</h2>
          <label class="date-field">
            <span class="sr-only">日期</span>
            <input id="entry-date" type="date" />
          </label>
        </div>

        <div class="weight-row">
          <input
            id="weight-input"
            type="number"
            inputmode="decimal"
            step="0.1"
            min="20"
            max="300"
            placeholder="0.0"
            aria-label="体重（公斤）"
          />
          <span class="unit">kg</span>
        </div>

        <label class="note-field">
          <span>备注（可选）</span>
          <input id="note-input" type="text" maxlength="80" placeholder="例如：早餐后 / 运动日" />
        </label>

        <button id="save-btn" class="btn primary" type="button">保存记录</button>
        <p id="save-feedback" class="feedback" role="status" aria-live="polite"></p>
      </section>

      <section class="panel stats" aria-label="概览">
        <div class="stat">
          <span class="stat-label">最近</span>
          <strong id="stat-latest">—</strong>
        </div>
        <div class="stat">
          <span class="stat-label">较上次</span>
          <strong id="stat-delta">—</strong>
        </div>
        <div class="stat">
          <span class="stat-label">目标</span>
          <button id="goal-btn" class="stat-goal" type="button" title="设置目标体重">
            <strong id="stat-goal">未设</strong>
          </button>
        </div>
      </section>

      <section class="panel chart-panel" aria-labelledby="chart-title">
        <div class="panel-head">
          <h2 id="chart-title">趋势</h2>
          <div class="range-tabs" role="tablist" aria-label="时间范围">
            <button type="button" class="range-tab is-active" data-range="7">7天</button>
            <button type="button" class="range-tab" data-range="30">30天</button>
            <button type="button" class="range-tab" data-range="all">全部</button>
          </div>
        </div>
        <div class="chart-wrap">
          <canvas id="chart" width="640" height="280" aria-label="体重趋势图"></canvas>
          <p id="chart-empty" class="empty-hint hidden">还没有足够数据，先记一笔吧</p>
        </div>
      </section>

      <section class="panel history-panel" aria-labelledby="history-title">
        <div class="panel-head">
          <h2 id="history-title">历史</h2>
          <span id="history-count" class="muted"></span>
        </div>
        <ul id="history-list" class="history-list"></ul>
        <p id="history-empty" class="empty-hint">暂无记录</p>
      </section>

      <section class="panel tools" aria-labelledby="tools-title">
        <h2 id="tools-title">备份</h2>
        <p class="tools-copy">数据保存在本机浏览器。清缓存或换手机前，请先导出。</p>
        <div class="tool-actions">
          <button id="export-btn" class="btn ghost" type="button">导出备份</button>
          <label class="btn ghost file-btn">
            导入备份
            <input id="import-input" type="file" accept="application/json,.json" hidden />
          </label>
        </div>
      </section>

      <footer class="foot">
        <p>轻衡 · 个人体重记录</p>
        <p class="muted">添加到主屏幕后，可像 App 一样打开</p>
      </footer>
    </main>

    <dialog id="goal-dialog" class="dialog">
      <form method="dialog" id="goal-form">
        <h3>目标体重</h3>
        <p class="dialog-copy">设一个想达到的公斤数，概览里会显示差距。</p>
        <div class="weight-row compact">
          <input
            id="goal-input"
            type="number"
            inputmode="decimal"
            step="0.1"
            min="20"
            max="300"
            placeholder="例如 60.0"
            aria-label="目标体重（公斤）"
          />
          <span class="unit">kg</span>
        </div>
        <div class="dialog-actions">
          <button value="clear" class="btn ghost" type="submit">清除</button>
          <button value="cancel" class="btn ghost" type="submit">取消</button>
          <button value="save" class="btn primary" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <script src="./app.js" type="module"></script>
  </body>
</html>
